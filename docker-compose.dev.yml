# ─────────────────────────────────────────────────────────────
# Local development: brings up the backing service the app needs — Postgres —
# with host-published port, so one command starts it instead of running it by hand.
# The api, web, worker, and Telegram bot apps run on the host via `bun run dev`
# (watch/hot-reload, turbo) and reach Postgres over localhost.
# Attachments and media are stored on the local filesystem (./storage) by default.
#
#   docker compose -f docker-compose.dev.yml up -d      # starts postgres
#
# If host port 5432 is taken (a local Postgres is already running),
# pick another:  POSTGRES_PORT=5433 docker compose -f docker-compose.dev.yml up -d
# and update the port in DATABASE_URL inside .env.
#
# The self-hosting stack (every service, built from source) lives in
# docker-compose.yml; the Coolify variant in docker-compose.coolify.yml.
# ─────────────────────────────────────────────────────────────
name: itsaplan-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsaplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsaplan}
      POSTGRES_DB: ${POSTGRES_DB:-itsaplan}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-itsaplan} -d ${POSTGRES_DB:-itsaplan}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-dev-data:
